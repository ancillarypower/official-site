name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard against exposed secrets in VITE_ env vars
        run: |
          if grep -rE 'VITE_.*(SECRET|KEY|TOKEN|PASSWORD)' .env.example; then
            echo "::error::Sensitive variables must not use VITE_ prefix — they are embedded in the client bundle"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Generate coverage
        id: coverage
        continue-on-error: true
        run: pnpm test:coverage

      - name: Check coverage threshold
        if: steps.coverage.outcome == 'success'
        run: |
          PCT=$(node --input-type=commonjs -e "
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
            console.log(Math.round(summary.total.lines.pct));
          ")
          echo "Coverage: ${PCT}%"
          if [ "$PCT" -lt 90 ]; then
            echo "::warning::Coverage ${PCT}% is below the 90% threshold"
          fi

      - name: Build
        run: pnpm build
