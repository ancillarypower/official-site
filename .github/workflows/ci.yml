name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # Note: pnpm cache requires a lockfile for cache key computation.
          # After first local `pnpm install`, commit pnpm-lock.yaml and
          # re-enable: cache: pnpm + --frozen-lockfile below.

      - name: Install dependencies
        # TODO: switch to `pnpm install --frozen-lockfile` once pnpm-lock.yaml is committed
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Test
        run: pnpm test -- --reporter=verbose

      - name: Build
        run: pnpm build
