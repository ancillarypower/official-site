name: Generate pnpm-lock.yaml

on: workflow_dispatch

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install dependencies and generate lockfile
        run: pnpm install

      - name: Commit lockfile and open PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f pnpm-lock.yaml ]; then
            echo "::error::pnpm-lock.yaml was not generated"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="chore/update-pnpm-lockfile"
          git checkout -b "$BRANCH"
          git add pnpm-lock.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit \u2014 lockfile already up to date"
            exit 0
          fi

          git commit -m "chore: update pnpm-lock.yaml"
          git push origin "$BRANCH"

          gh pr create \
            --title "chore: update pnpm-lock.yaml" \
            --body "Regenerated lockfile via CI runner. Review and merge to update dependency pins." \
            --base main \
            --head "$BRANCH"
