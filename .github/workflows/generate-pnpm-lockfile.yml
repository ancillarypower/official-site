name: Generate pnpm-lock.yaml

on: workflow_dispatch

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install dependencies and generate lockfile
        run: pnpm install

      - name: Commit lockfile and open PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f pnpm-lock.yaml ]; then
            echo "::error::pnpm-lock.yaml was not generated"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="chore/add-pnpm-lockfile"
          git checkout -b "$BRANCH"
          git add pnpm-lock.yaml

          if git diff --cached --quiet; then
            echo "No changes to commit — lockfile already up to date"
            exit 0
          fi

          git commit -m "chore: add pnpm-lock.yaml for reproducible builds"
          git push origin "$BRANCH"

          gh pr create \
            --title "chore: add pnpm-lock.yaml (closes #204)" \
            --body "## Summary

          Generated \`pnpm-lock.yaml\` via CI runner with full npm registry access.

          This lockfile pins every transitive dependency to an exact version, enabling:
          - Reproducible builds across CI and local environments
          - Deterministic \`pnpm install --frozen-lockfile\` in CI
          - Proper dependency caching via \`cache-dependency-path: 'pnpm-lock.yaml'\`

          Closes #204" \
            --base main \
            --head "$BRANCH"
