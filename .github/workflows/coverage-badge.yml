name: Coverage Badge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coverage-badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Check coverage threshold
        run: |
          PCT=$(node --input-type=commonjs -e "
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
            console.log(Math.round(summary.total.lines.pct));
          ")
          echo "COVERAGE_PCT=$PCT" >> "$GITHUB_ENV"
          echo "Coverage: ${PCT}%"
          if [ "$PCT" -lt 90 ]; then
            echo "::error::Coverage ${PCT}% is below the 90% threshold"
            exit 1
          fi

      - name: Generate badge SVG
        run: |
          if [ "$COVERAGE_PCT" -ge 80 ]; then COLOR="brightgreen"
          elif [ "$COVERAGE_PCT" -ge 60 ]; then COLOR="yellow"
          else COLOR="red"; fi

          mkdir -p .badges
          curl -sfL "https://img.shields.io/badge/coverage-${COVERAGE_PCT}%25-${COLOR}?style=flat-square" \
            -o .badges/coverage.svg

          if [ ! -s .badges/coverage.svg ]; then
            echo "::error::Failed to generate coverage badge SVG"
            exit 1
          fi

      - name: Push badge to badges branch
        run: |
          cd .badges
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b badges
          git add coverage.svg
          git commit -m "chore: update coverage badge (${COVERAGE_PCT}%)"
          git remote add origin \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push origin badges --force
