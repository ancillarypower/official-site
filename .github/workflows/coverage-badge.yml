name: Coverage Badge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  coverage-badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Generate badge SVG
        run: |
          PCT=$(node -e "
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
            console.log(Math.round(summary.total.lines.pct));
          ")
          echo "COVERAGE_PCT=$PCT" >> "$GITHUB_ENV"

          if [ "$PCT" -ge 80 ]; then COLOR="brightgreen"
          elif [ "$PCT" -ge 60 ]; then COLOR="yellow"
          else COLOR="red"; fi

          mkdir -p .badges
          curl -sfL "https://img.shields.io/badge/coverage-${PCT}%25-${COLOR}?style=flat-square" \
            -o .badges/coverage.svg

      - name: Push badge to badges branch
        run: |
          cd .badges
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b badges
          git add coverage.svg
          git commit -m "chore: update coverage badge (${COVERAGE_PCT}%)"
          git remote add origin \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push origin badges --force
