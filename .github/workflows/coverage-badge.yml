name: Coverage Badge

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    outputs:
      coverage_pct: ${{ steps.threshold.outputs.coverage_pct }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'package.json'

      - name: Install dependencies
        run: pnpm install

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Check coverage threshold
        id: threshold
        run: |
          PCT=$(node --input-type=commonjs -e "
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
            console.log(Math.round(summary.total.lines.pct));
          ")
          echo "coverage_pct=$PCT" >> "$GITHUB_OUTPUT"
          echo "Coverage: ${PCT}%"
          if [ "$PCT" -lt 90 ]; then
            echo "::error::Coverage ${PCT}% is below the 90% threshold"
            exit 1
          fi

      - name: Generate badge SVG
        run: |
          PCT="${{ steps.threshold.outputs.coverage_pct }}"
          if [ "$PCT" -ge 80 ]; then COLOR="brightgreen"
          elif [ "$PCT" -ge 60 ]; then COLOR="yellow"
          else COLOR="red"; fi

          mkdir -p .badges
          curl -sfL "https://img.shields.io/badge/coverage-${PCT}%25-${COLOR}?style=flat-square" \
            -o .badges/coverage.svg

          if [ ! -s .badges/coverage.svg ]; then
            echo "::error::Failed to generate coverage badge SVG"
            exit 1
          fi

      - name: Upload badge artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-badge
          path: .badges/coverage.svg
          retention-days: 1

  push-badge:
    needs: test-coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download badge artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-badge
          path: .badges

      - name: Push badge to badges branch
        run: |
          COVERAGE_PCT="${{ needs.test-coverage.outputs.coverage_pct }}"
          cd .badges
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b badges
          git add coverage.svg
          git commit -m "chore: update coverage badge (${COVERAGE_PCT}%)"
          git remote add origin \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push origin badges --force
